<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — ShopVerse</title>
  <meta name="description" content="Create a ShopVerse account to place orders and review products.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=1">
</head>
<body data-page="register">
  <div id="site-header"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <a class="logo" href="/" aria-label="ShopVerse home">
          <span class="logo__word">shop<span>verse</span></span>
          <svg class="logo__smile" viewBox="0 0 100 20" fill="none" aria-hidden="true">
            <path d="M3 4c20 13 58 15 84 5" stroke="#febd69" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M80 3.5 89 7l-7.5 6" stroke="#febd69" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <div class="auth-card__box">
        <h1>Create account</h1>
        <div class="auth-error" id="auth-error" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="register-name">Your name</label>
            <input class="form-input" id="register-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="register-email">Email</label>
            <input class="form-input" id="register-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="register-password">Password</label>
            <input class="form-input" id="register-password" name="password" type="password" autocomplete="new-password" required>
            <p class="form-hint">At least 8 characters. Passwords are salted and hashed with scrypt.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="register-confirm">Re-enter password</label>
            <input class="form-input" id="register-confirm" name="confirm" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit" id="register-submit">Create your ShopVerse account</button>
        </form>

        <p class="auth-card__terms">
          By creating an account you agree to the ShopVerse demo terms. No real data is shared
          with third parties.
        </p>
      </div>

      <p class="auth-card__foot">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/js/api.js?v=1"></script>
  <script src="/js/layout.js?v=1"></script>
  <script src="/js/auth.js?v=1"></script>
</body>
</html>
