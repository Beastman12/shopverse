<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — ShopVerse</title>
  <meta name="description" content="Review the items in your ShopVerse cart and proceed to checkout.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=1">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="container cart-page">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a>
      <span class="breadcrumbs__sep">›</span>
      <span>Shopping cart</span>
    </nav>

    <div class="page-title-row">
      <h1>Shopping Cart</h1>
      <p id="cart-count-label">Loading…</p>
    </div>

    <div class="cart-layout">
      <section class="panel" aria-labelledby="cart-items-heading">
        <div class="panel__head">
          <h2 id="cart-items-heading">Your items</h2>
          <a href="/search">Continue shopping</a>
        </div>
        <div id="cart-items">
          <div class="loading-block">
            <div class="spinner"></div>
            <p>Loading your cart…</p>
          </div>
        </div>
      </section>

      <aside id="cart-summary" aria-label="Order summary"></aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/js/api.js?v=1"></script>
  <script src="/js/layout.js?v=1"></script>
  <script src="/js/cart.js?v=1"></script>
</body>
</html>
